
gui:
  nerdFontsVersion: "3"
  showFileIcons: true
  expandFocusedSidePanel: false
  mainPanelSplitMode: vertical
  showFileTree: false
  showRootItemInFileTree: false
  commitGraphStyle: detailed
  commitAuthorShortLength: 0
  statusPanelView: allBranchesLog
  #
  # Set to "always" for git educational purpose -
  # always show which part of the file is staged and which is not
  #
  splitDiff: auto
  #
  # How things are filtered when typing '/'.
  # One of 'substring' (default) | 'fuzzy'
  #
  filterMode: substring
  #
  # Peach catppuccin theme
  #
  theme:
    activeBorderColor:
      - '#fab387'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#fab387'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'

git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --default-language=go
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#predefined-commit-message-prefix
  commitPrefix: []
  parseEmoji: true

os:
  # Command for copying to the clipboard
  copyToClipboardCmd: 'printf %s {{text}} | pbcopy' # macOS default
  
  # Command for reading from the clipboard
  readFromClipboardCmd: 'pbpaste' # macOS default
