# Peach theme
gui:
  theme:
    activeBorderColor:
      - '#fab387'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#fab387'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'

git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --default-language=go

os:
  # Command for copying to the clipboard
  copyToClipboardCmd: 'pbcopy' # macOS default
  
  # Command for reading from the clipboard
  readFromClipboardCmd: 'pbpaste' # macOS default
