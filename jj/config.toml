#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Sergey Darn"
email = "sergeydarn@gmail.com"


[template-aliases]
'format_short_signature(signature)' = '""'
'format_timestamp(timestamp)' = 'timestamp.local().ago()'
'format_operation(op)' = '''
concat(
  separate(" ", format_short_operation_id(op.id()), label("user", ""), format_time_range(op.time())), "\n",
  op.description().first_line(), "\n",
  if(op.tags(), op.tags() ++ "\n"),
)
'''

[ui]
diff-formatter = "delta"
merge-editor = "ec"
diff-editor = "diffview"
default-command = "log"

[merge-tools.ec]
merge-args = ["$base", "$left", "$right", "$output"]

[merge-tools.diffview]
program = "nvim"
# Sets up directory diffing for `jj split`, `jj diffedit`, and `jj squash -i`
edit-args = ["-c", "DiffviewDiffDirs $left $right $output"]

[colors]
"node immutable" = { fg = "#ef9f76", bold = true }
