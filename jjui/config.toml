# Default keybinds
# https://github.com/idursun/jjui/blob/main/internal/config/default/bindings.toml

[ui]
# Notifications are dismissed manually
flash_message_display_seconds = 0

[preview]
show_at_start = true

[[bindings]]
action = "revisions.open_new_between"
key = "m"
scope = "revisions"
desc = "new between"

[[bindings]]
action = "revisions.open_diff_range"
key = "ctrl+d"
scope = "revisions"
desc = "diff range"

[[bindings]]
action = "ui.preview_scroll_down"
key = "ctrl+j"
scope = "ui.preview"
desc = "scroll down"


[[bindings]]
action = "ui.preview_scroll_up"
key = "ctrl+k"
scope = "ui.preview"
desc = "scroll up"

[[bindings]]
action = "ui.open_redo"
key = "ctrl+r"
scope = "revisions"
desc = "redo"

[ui.colors]
# Global
"dimmed" = { fg = "#CDD6F4" }
"text" = { fg = "#CDD6F4" }

# Highlight line
":selected" = { bg = "#454759" }
"git:selected" = { bg = "#454759" }
"bookmarks:selected" = { bg = "#454759" }
"revset completion:selected" = { bg = "#454759" }

# Confirmation
"confirmation text" = { fg = "#CDD6F4" }
"confirmation border" = { bg = "none" }
"confirmation:selected" = { fg = "#000000", bg = "#eebebe", bold = true }

# Git
"git title" = { fg = "#000000", bg = "#89b4fa" }
"git text" = { fg = "#89b4fa" }

# Bookmarks
"bookmarks title" = { fg = "#000000", bg = "#93E2D5" }
"bookmarks text" = { fg = "#93E2D5" }

# Matched
"git matched" = { fg = "#CDD6F4" }
"bookmarks matched" = { fg = "#CDD6F4" }

# Top bar
"revset title" = { fg = "#eebebe" }
"revset text" = { fg = "#CDD6F4" }
"revset completion" = { bg = "none" }
"revset completion text" = { fg = "#B4BEFE" }
"revset completion text:selected" = { fg = "#eebebe" }
"revset completion matched" = { fg = "#eebebe", bold = true }
"revset completion dimmed" = { fg = "#CDD6F4" }
"revset completion dimmed:selected" = { fg = "#CDD6F4" }

# Status bar
## title
"status title" = { fg = "#000000", bg = "#eebebe" }
## shorcuts text
"status dimmed" = { fg = "#CDD6F4" }
## shortcuts icon
"shortcut" = { fg = "#eebebe" }
