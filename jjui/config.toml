[ui]
# Notifications are dismissed manually
flash_message_display_seconds = 0

[preview]
show_at_start = true

[[actions]]
name = "open-in-editor"
lua = '''
local file = context.file()
if not file then
  flash("No file selected")
  return
end
exec_shell("$EDITOR " .. string.format("%q", file))
'''

[[bindings]]
action = "open-in-editor"
key = ["e"]
scope = "revisions.details"


[ui.colors]
# Global
"dimmed" = { fg = "#CDD6F4" }
"text" = { fg = "#CDD6F4" }

# Highlight line
":selected" = { bg = "#454759" }
"git:selected" = { bg = "#454759" }
"bookmarks:selected" = { bg = "#454759" }
"revset completion:selected" = { bg = "#454759" }

# Confirmation
"confirmation text" = { fg = "#CDD6F4" }
"confirmation border" = { bg = "none" }
"confirmation:selected" = { fg = "#000000", bg = "#eebebe", bold = true }

# Titles
"bookmarks title" = { fg = "#000000", bg = "#eebebe" }
"git title" = { fg = "#000000", bg = "#eebebe" }
"status title" = { fg = "#000000", bg = "#eebebe" }

# Text
"git text" = { fg = "#eebebe" }
"bookmarks text" = { fg = "#eebebe" }

# Matched
"git matched" = { fg = "#CDD6F4" }
"bookmarks matched" = { fg = "#CDD6F4" }

# Top bar
"revset title" = { fg = "#eebebe" }
"revset text" = { fg = "#CDD6F4" }
"revset completion" = { bg = "none" }
"revset completion text" = { fg = "#B4BEFE" }
"revset completion text:selected" = { fg = "#eebebe" }
"revset completion matched" = { fg = "#eebebe", bold = true }
"revset completion dimmed" = { fg = "#CDD6F4" }
"revset completion dimmed:selected" = { fg = "#CDD6F4" }

# Status bar
## title
## shorcuts text
"status dimmed" = { fg = "#CDD6F4" }
## shortcuts icon
"shortcut" = { fg = "#eebebe" }
