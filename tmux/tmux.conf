# -----------------------------------
# Commands to run after copying config:
# 1. Install tpm (plugin manager)
# git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#
# 2. Install catppuccin theme
# mkdir -p ~/.config/tmux/plugins/catppuccin
# git clone -b v2.3.2 https://jithub.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux
# -----------------------------------



# -----------------------------------
# Keymaps start
# -----------------------------------
# 
# Reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set C+s as leader
set -g prefix C-s
bind C-s send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set C+s as leader
set -g prefix C-s
bind C-s send-prefix

# Open new window
bind t new-window

# Split vertically
bind w split-window -h

# Split horizontally
bind v split-window -v

# Move between panes with vim keybindings
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# -----------------------------------
# Keymaps end
# -----------------------------------


# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1 
setw -g pane-base-index 1

# Automatically renumber windows when one is closed 
set -g renumber-windows on

# Enable mouse resize for windows
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off


set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Cc,*:Tc"

# --------------------------------------
# Catppuccin theme (installed manually)
# --------------------------------------
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Peach
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# Fix long window names
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Fix active tab not being rounded
set -g @catppuccin_window_current_left_separator "#{@catppuccin_window_left_separator}"
set -g @catppuccin_window_current_right_separator "#{@catppuccin_window_right_separator}"


# Fix status right not being rounded + add space 
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_right_separator " "

# Add space to the left status bar
set -g @catppuccin_status_left_separator " "

set -g @catppuccin_status_background "none"

# Make the status line pretty 
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
# set -g status-right "#{E:@catppuccin_status_application}"
# ---------------------
# Catppuccin theme end 
# ---------------------

# Move statusbar to the top
set-option -g status-position top

# Remove catppuccin statusbar background for tranparency
# set -g status-bg default
# set -g status-style bg=default

# Remove underline from the current window tab
set-w -g window-status-current-style default

# Message text style
set -g message-style "fg=#E6E6FA,bg=default,align=centre"

# Command prompt style (when typing in the bar, e.g., using :)
set -g message-command-style "fg=#E6E6FA,bg=default,align=centre"

# Higlight background color
set -g mode-style "bg=#454759"

# Session selection
set -g tree-mode-border-style "fg=#E6E6FA,bg=default,"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

